<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">Practice with purpose</p>
            <h1>AI Interview Coach</h1>
            <p class="hero-text">Prepare for internships with role-based questions, answer scoring, history tracking, and structured feedback.</p>
        </section>

        <section class="panel">
            <h2>Start a mock interview</h2>
            <form action="/interview" method="POST" class="form">
                <label for="username">Your name</label>
                <input type="text" id="username" name="username" placeholder="Ruder Mittal" required>

                <label for="role">Choose role</label>
                <select id="role" name="role" required>
                    {% for role in roles %}
                        <option value="{{ role }}">{{ role }}</option>
                    {% endfor %}
                </select>

                <button type="submit">Start Interview</button>
            </form>

            <div class="nav-links">
                <a class="secondary-link" href="/dashboard">View Progress Dashboard</a>
            </div>
        </section>
    </main>
</body>
</html>
